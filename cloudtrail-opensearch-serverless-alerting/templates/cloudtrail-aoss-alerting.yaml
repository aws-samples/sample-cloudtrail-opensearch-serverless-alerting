AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudTrail log analytics and alerting with Amazon OpenSearch Serverless (time series collection),
  Amazon OpenSearch Ingestion, Amazon ECS on AWS Fargate (Graviton/ARM64), Amazon EventBridge, and Amazon SNS.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "CloudTrail source" }
        Parameters: [CloudTrailBucketName, CloudTrailPrefix]
      - Label: { default: "OpenSearch Serverless" }
        Parameters: [Generation, CollectionName, IndexName, RetentionDays, StandbyReplicas, AdminPrincipalArn]
      - Label: { default: "Detection task" }
        Parameters: [VpcId, VpcCidr, SubnetIds, AssignPublicIp, ContainerImageUri, ScheduleExpression, ScheduleState, AlertEmail]

Parameters:
  CloudTrailBucketName:
    Type: String
    Description: Name of the existing S3 bucket where your CloudTrail trail delivers logs.
  CloudTrailPrefix:
    Type: String
    Default: ""
    Description: >-
      Key prefix for CloudTrail log objects, used in the S3 event notification output. Leave empty to use
      AWSLogs/<this account>/CloudTrail/, which excludes CloudTrail-Digest files. For an organization trail,
      use AWSLogs/<org-id>/<account-id>/CloudTrail/.
  Generation:
    Type: String
    Default: CLASSIC
    AllowedValues: [CLASSIC, NEXTGEN]
    Description: >-
      CLASSIC creates a standalone collection with the Classic OCU minimum. NEXTGEN creates a NextGen
      collection group whose indexing and search capacity can scale to zero when idle.
  CollectionName:
    Type: String
    Default: cloudtrail-logs
    AllowedPattern: "^[a-z][a-z0-9-]{2,31}$"
    Description: Name of the OpenSearch Serverless time series collection (3-32 lowercase characters).
  IndexName:
    Type: String
    Default: cloudtrail-logs
    Description: Index that the ingestion pipeline writes to and the detection task queries.
  RetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to retain CloudTrail events in the collection (data lifecycle policy).
  StandbyReplicas:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: ENABLED for production. DISABLED for dev/test (halves the Classic OCU minimum).
  AdminPrincipalArn:
    Type: String
    Default: ""
    Description: >-
      Optional IAM user or role ARN that gets read access to the collection for OpenSearch Dashboards and
      ad-hoc queries (for example, arn:aws:iam::123456789012:role/Admin). Without it, your own queries return 403.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the Fargate detection task.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: CIDR block of the VPC, used to scope egress to VPC-routed endpoints only (e.g. 10.0.0.0/8).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the Fargate task. Use public subnets (task gets a public IP) or private subnets with a NAT gateway.
  AssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: ENABLED for public subnets. DISABLED for private subnets that route through a NAT gateway.
  ContainerImageUri:
    Type: String
    Default: ""
    Description: Detection image URI. Leave empty to use the ECR repository this stack creates (tag latest).
  ScheduleExpression:
    Type: String
    Default: rate(1 hour)
    Description: How often the detection task runs.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Leave DISABLED until you push the container image, then update the stack to ENABLED.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address to subscribe to alerts (you must confirm the subscription).

Conditions:
  UseStackRepo: !Equals [!Ref ContainerImageUri, ""]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasAdmin: !Not [!Equals [!Ref AdminPrincipalArn, ""]]
  IsNextGen: !Equals [!Ref Generation, NEXTGEN]
  DefaultPrefix: !Equals [!Ref CloudTrailPrefix, ""]

Resources:
  # ---------------------------------------------------------------------------
  # KMS key for CloudWatch Logs encryption
  # ---------------------------------------------------------------------------
  LogsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CloudWatch Logs encryption (pipeline and task log groups)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccess
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: "*"
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/OpenSearchIngestion/cloudtrail-pipeline"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/cloudtrail-alert"

  # ---------------------------------------------------------------------------
  # Amazon OpenSearch Serverless
  # ---------------------------------------------------------------------------
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${CollectionName}-enc"
      Type: encryption
      Policy: !Sub '{"Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"]}],"AWSOwnedKey":true}'

  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${CollectionName}-net"
      Type: network
      # Public access for the reference deployment. For production, replace AllowFromPublic
      # with "SourceVPCEs":["<vpce-id>"] using an OpenSearch Serverless VPC endpoint.
      Policy: !Sub '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"]},{"ResourceType":"dashboard","Resource":["collection/${CollectionName}"]}],"AllowFromPublic":true}]'

  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${CollectionName}-access"
      Type: data
      Policy: !If
        - HasAdmin
        - !Sub
          - '[{"Description":"OSI pipeline - write","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:WriteDocument"]}],"Principal":["${PipelineRoleArn}"]},{"Description":"Detection task - read-only","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:ReadDocument","aoss:DescribeIndex"]}],"Principal":["${TaskRoleArn}"]},{"Description":"Operator - read-only for Dashboards and ad-hoc queries","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:ReadDocument","aoss:DescribeIndex"]},{"ResourceType":"collection","Resource":["collection/${CollectionName}"],"Permission":["aoss:DescribeCollectionItems"]}],"Principal":["${AdminPrincipalArn}"]}]'
          - PipelineRoleArn: !GetAtt PipelineRole.Arn
            TaskRoleArn: !GetAtt TaskRole.Arn
        - !Sub
          - '[{"Description":"OSI pipeline - write","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:WriteDocument"]}],"Principal":["${PipelineRoleArn}"]},{"Description":"Detection task - read-only","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:ReadDocument","aoss:DescribeIndex"]}],"Principal":["${TaskRoleArn}"]}]'
          - PipelineRoleArn: !GetAtt PipelineRole.Arn
            TaskRoleArn: !GetAtt TaskRole.Arn

  CollectionGroup:
    Type: AWS::OpenSearchServerless::CollectionGroup
    Condition: IsNextGen
    Properties:
      Name: !Sub "${CollectionName}-group"
      Generation: NEXTGEN
      StandbyReplicas: !Ref StandbyReplicas
      Description: NextGen collection group for CloudTrail log analytics
      CapacityLimits:
        MinIndexingCapacityInOcu: 0
        MaxIndexingCapacityInOcu: 4
        MinSearchCapacityInOcu: 0
        MaxSearchCapacityInOcu: 4

  Collection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn: [EncryptionPolicy, NetworkPolicy]
    Properties:
      Name: !Ref CollectionName
      Type: TIMESERIES
      CollectionGroupName: !If [IsNextGen, !Ref CollectionGroup, !Ref AWS::NoValue]
      StandbyReplicas: !If [IsNextGen, !Ref AWS::NoValue, !Ref StandbyReplicas]
      Description: CloudTrail management events

  RetentionPolicy:
    Type: AWS::OpenSearchServerless::LifecyclePolicy
    DependsOn: Collection
    Properties:
      Name: !Sub "${CollectionName}-retention"
      Type: retention
      Policy: !Sub '{"Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"MinIndexRetention":"${RetentionDays}d"}]}'

  # ---------------------------------------------------------------------------
  # Ingestion: SQS queue + OpenSearch Ingestion pipeline
  # ---------------------------------------------------------------------------
  IngestDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudtrail-log-queue-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudtrail-log-queue
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDeadLetterQueue.Arn
        maxReceiveCount: 5

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3Notifications
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:s3:::${CloudTrailBucketName}" }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: osi-cloudtrail-pipeline-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:GetObject]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${CloudTrailBucketName}/*"
          - Effect: Allow
            Action: [s3:ListBucket, s3:GetBucketLocation]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${CloudTrailBucketName}"
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility]
            Resource: !GetAtt IngestQueue.Arn
          - Effect: Allow
            Action: [aoss:BatchGetCollection, aoss:APIAccessAll]
            Resource: !GetAtt Collection.Arn
            # If your CloudTrail bucket uses SSE-KMS, also grant kms:Decrypt on that key.

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: osi-cloudtrail-pipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: osis-pipelines.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      ManagedPolicyArns:
        - !Ref PipelinePolicy

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/OpenSearchIngestion/cloudtrail-pipeline
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogsKmsKey.Arn

  IngestionPipeline:
    Type: AWS::OSIS::Pipeline
    DependsOn: [DataAccessPolicy, IngestQueuePolicy]
    Properties:
      PipelineName: cloudtrail-pipeline
      MinUnits: 1
      MaxUnits: 4
      LogPublishingOptions:
        IsLoggingEnabled: true
        CloudWatchLogDestination:
          LogGroup: !Ref PipelineLogGroup
      PipelineConfigurationBody: !Sub |
        version: "2"
        cloudtrail-log-pipeline:
          source:
            s3:
              acknowledgments: true
              notification_type: "sqs"
              compression: gzip
              codec:
                json:
              sqs:
                queue_url: "${IngestQueue}"
                maximum_messages: 10
                visibility_timeout: "60s"
                visibility_duplication_protection: true
              aws:
                region: "${AWS::Region}"
                sts_role_arn: "${PipelineRole.Arn}"
          processor:
            - date:
                destination: "@timestamp"
                from_time_received: true
            - delete_entries:
                with_keys: [ "s3" ]
          sink:
            - opensearch:
                hosts: [ "${Collection.CollectionEndpoint}" ]
                index: "${IndexName}"
                aws:
                  sts_role_arn: "${PipelineRole.Arn}"
                  region: "${AWS::Region}"
                  serverless: true

  # ---------------------------------------------------------------------------
  # Alerting: SNS
  # ---------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloudtrail-create-alerts
      KmsMasterKeyId: alias/aws/sns

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------------------
  # Detection: ECR, ECS on Fargate (ARM64), EventBridge schedule
  # ---------------------------------------------------------------------------
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cloudtrail-alert
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: KMS

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cloudtrail-alert

  TaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/cloudtrail-alert
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogsKmsKey.Arn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtrail-alert-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: cloudtrail-alert-ecs-task-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Required for any OpenSearch Serverless data-plane call. Read-only access is
          # enforced by the data access policy (ReadDocument + DescribeIndex).
          - Effect: Allow
            Action: aoss:APIAccessAll
            Resource: !GetAtt Collection.Arn
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref AlertTopic

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtrail-alert-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TaskPolicy

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only access for the CloudTrail detection task
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS to OpenSearch Serverless, SNS, ECR, and CloudWatch Logs

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudtrail-alert
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: cloudtrail-alert
          Image: !If
            - UseStackRepo
            - !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${Repository}:latest"
            - !Ref ContainerImageUri
          Essential: true
          Environment:
            - { Name: COLLECTION_ENDPOINT, Value: !GetAtt Collection.CollectionEndpoint }
            - { Name: INDEX, Value: !Ref IndexName }
            - { Name: SNS_TOPIC_ARN, Value: !Ref AlertTopic }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref TaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: cloudtrail-alert-events-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ecs:RunTask
            Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/cloudtrail-alert:*"
            Condition:
              ArnEquals: { "ecs:cluster": !GetAtt Cluster.Arn }
          - Effect: Allow
            Action: iam:PassRole
            Resource: [!GetAtt TaskRole.Arn, !GetAtt TaskExecutionRole.Arn]

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtrail-alert-events-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventsPolicy

  DetectionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudtrail-create-alert-hourly
      Description: Runs the CloudTrail detection task on a schedule
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref ScheduleState
      Targets:
        - Id: cloudtrail-alert-task
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets: !Ref SubnetIds
                SecurityGroups: [!Ref TaskSecurityGroup]
                AssignPublicIp: !Ref AssignPublicIp

Outputs:
  CollectionEndpoint:
    Value: !GetAtt Collection.CollectionEndpoint
  DashboardsEndpoint:
    Value: !GetAtt Collection.DashboardEndpoint
  DeadLetterQueueUrl:
    Description: Messages land here after 5 failed processing attempts; alarm on its depth
    Value: !Ref IngestDeadLetterQueue
  Generation:
    Value: !Ref Generation
  IngestQueueArn:
    Description: Target for the S3 event notification on your CloudTrail bucket
    Value: !GetAtt IngestQueue.Arn
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  AlertTopicArn:
    Value: !Ref AlertTopic
  NextStepS3Notification:
    Description: Run after deployment to send new CloudTrail objects to the queue
    Value: !Sub
      - >-
        aws s3api put-bucket-notification-configuration --bucket ${CloudTrailBucketName}
        --notification-configuration '{"QueueConfigurations":[{"QueueArn":"${IngestQueue.Arn}","Events":["s3:ObjectCreated:*"],"Filter":{"Key":{"FilterRules":[{"Name":"prefix","Value":"${Prefix}"},{"Name":"suffix","Value":".json.gz"}]}}}]}'
      - Prefix: !If [DefaultPrefix, !Sub "AWSLogs/${AWS::AccountId}/CloudTrail/", !Ref CloudTrailPrefix]
