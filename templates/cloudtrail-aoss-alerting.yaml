AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudTrail log analytics and alerting with Amazon OpenSearch Serverless (time series collection),
  Amazon OpenSearch Ingestion, Amazon ECS on AWS Fargate (Graviton/ARM64), Amazon EventBridge, and Amazon SNS.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "CloudTrail source" }
        Parameters: [CloudTrailBucketName, CloudTrailPrefix]
      - Label: { default: "OpenSearch Serverless" }
        Parameters: [Generation, CollectionName, IndexName, RetentionDays, StandbyReplicas, AdminPrincipalArn]
      - Label: { default: "Network" }
        Parameters: [VpcCidr]
      - Label: { default: "Detection task" }
        Parameters: [ContainerImageUri, ImageTag, ScheduleExpression, ScheduleState, AlertEmail]

Parameters:
  CloudTrailBucketName:
    Type: String
    Description: Name of the existing S3 bucket where your CloudTrail trail delivers logs.
  CloudTrailPrefix:
    Type: String
    Default: ""
    Description: >-
      Key prefix for CloudTrail log objects, used in the S3 event notification output. Leave empty to use
      AWSLogs/<this account>/CloudTrail/, which excludes CloudTrail-Digest files. For an organization trail,
      use AWSLogs/<org-id>/<account-id>/CloudTrail/.
  Generation:
    Type: String
    Default: CLASSIC
    AllowedValues: [CLASSIC, NEXTGEN]
    Description: >-
      CLASSIC creates a standalone collection with the Classic OCU minimum. NEXTGEN creates a NextGen
      collection group whose indexing and search capacity can scale to zero when idle.
  CollectionName:
    Type: String
    Default: cloudtrail-logs
    AllowedPattern: "^[a-z][a-z0-9-]{2,31}$"
    Description: Name of the OpenSearch Serverless time series collection (3-32 lowercase characters).
  IndexName:
    Type: String
    Default: cloudtrail-logs
    Description: Index that the ingestion pipeline writes to and the detection task queries.
  RetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to retain CloudTrail events in the collection (data lifecycle policy).
  StandbyReplicas:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: ENABLED for production. DISABLED for dev/test (halves the Classic OCU minimum).
  AdminPrincipalArn:
    Type: String
    Default: ""
    Description: >-
      Optional IAM user or role ARN that gets read access to the collection for OpenSearch Dashboards and
      ad-hoc queries (for example, arn:aws:iam::123456789012:role/Admin). Without it, your own queries return 403.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    Description: >-
      CIDR for the VPC this stack creates (/16). It is split into two public subnets (NAT gateway) and two
      private subnets (Fargate task and VPC endpoints).
  ContainerImageUri:
    Type: String
    Default: ""
    Description: Detection image URI. Leave empty to use the ECR repository this stack creates (tag ImageTag).
  ImageTag:
    Type: String
    Default: "1.0.0"
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    Description: >-
      Tag of the detection image in the stack's ECR repository. Tags are immutable, so push each new
      build under a new tag and update this parameter.
  ScheduleExpression:
    Type: String
    Default: rate(1 hour)
    Description: How often the detection task runs.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Leave DISABLED until you push the container image, then update the stack to ENABLED.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address to subscribe to alerts (you must confirm the subscription).

Conditions:
  UseStackRepo: !Equals [!Ref ContainerImageUri, ""]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasAdmin: !Not [!Equals [!Ref AdminPrincipalArn, ""]]
  IsNextGen: !Equals [!Ref Generation, NEXTGEN]
  DefaultPrefix: !Equals [!Ref CloudTrailPrefix, ""]

Resources:
  # ---------------------------------------------------------------------------
  # Network: VPC with public subnets (NAT gateway) and private subnets (task + endpoints)
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: cloudtrail-alert }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: cloudtrail-alert }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: cloudtrail-alert-public-1 }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: cloudtrail-alert-public-2 }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: cloudtrail-alert-private-1 }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: cloudtrail-alert-private-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: cloudtrail-alert-public }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # A single NAT gateway keeps cost down. For AZ-independent egress, add one per AZ.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags: [{ Key: Name, Value: cloudtrail-alert }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: cloudtrail-alert-private }]

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # VPC endpoints keep the task's AWS API traffic (OpenSearch Serverless, ECR, CloudWatch Logs,
  # SNS, and S3 for ECR image layers) on the AWS network. The NAT gateway covers anything else.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from the detection task to the VPC endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: HTTPS from the detection task

  AossVpcEndpoint:
    Type: AWS::OpenSearchServerless::VpcEndpoint
    Properties:
      Name: !Sub "${CollectionName}-vpce"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref Vpc
      RouteTableIds: [!Ref PrivateRouteTable]

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true

  SnsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sns"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true

  # ---------------------------------------------------------------------------
  # KMS key for CloudWatch Logs encryption
  # ---------------------------------------------------------------------------
  LogsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CloudWatch Logs encryption (pipeline and task log groups)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccess
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: "*"
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/OpenSearchIngestion/cloudtrail-pipeline"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/cloudtrail-alert"

  # ---------------------------------------------------------------------------
  # Amazon OpenSearch Serverless
  # ---------------------------------------------------------------------------
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${CollectionName}-enc"
      Type: encryption
      Policy: !Sub '{"Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"]}],"AWSOwnedKey":true}'

  # Private access only: the collection and Dashboards are reachable through the stack's
  # OpenSearch Serverless VPC endpoint. The ingestion pipeline reaches the collection through
  # its own VPC endpoint, which OpenSearch Ingestion adds to PipelineNetworkPolicy below.
  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${CollectionName}-net"
      Type: network
      Policy: !Sub '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"]},{"ResourceType":"dashboard","Resource":["collection/${CollectionName}"]}],"AllowFromPublic":false,"SourceVPCEs":["${AossVpcEndpoint}"]}]'

  # Network policy named in the pipeline sink (serverless_options.network_policy_name). When the
  # pipeline starts, OpenSearch Ingestion appends a rule admitting its own VPC endpoint. The stack
  # creates the policy so it always exists: that lets the pipeline role's aoss:*SecurityPolicy
  # permissions be scoped with the aoss:collection condition, which can't be evaluated for a
  # policy that doesn't exist yet. The initial rule only repeats NetworkPolicy's access. Leave
  # this resource's properties unchanged; a stack update that replaces the policy removes the
  # pipeline's rule until the pipeline is restarted.
  PipelineNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${CollectionName}-osi-net"
      Type: network
      Description: Network access for the OpenSearch Ingestion pipeline (rule added by the pipeline)
      Policy: !Sub '[{"Description":"Stack endpoint (initial rule)","Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"]}],"AllowFromPublic":false,"SourceVPCEs":["${AossVpcEndpoint}"]}]'

  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${CollectionName}-access"
      Type: data
      Policy: !If
        - HasAdmin
        - !Sub
          - '[{"Description":"OSI pipeline - write documents and manage the index template","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:WriteDocument"]},{"ResourceType":"collection","Resource":["collection/${CollectionName}"],"Permission":["aoss:CreateCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]}],"Principal":["${PipelineRoleArn}"]},{"Description":"Detection task - read-only","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:ReadDocument","aoss:DescribeIndex"]}],"Principal":["${TaskRoleArn}"]},{"Description":"Operator - read-only for Dashboards and ad-hoc queries","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:ReadDocument","aoss:DescribeIndex"]},{"ResourceType":"collection","Resource":["collection/${CollectionName}"],"Permission":["aoss:DescribeCollectionItems"]}],"Principal":["${AdminPrincipalArn}"]}]'
          - PipelineRoleArn: !GetAtt PipelineRole.Arn
            TaskRoleArn: !GetAtt TaskRole.Arn
        - !Sub
          - '[{"Description":"OSI pipeline - write documents and manage the index template","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:WriteDocument"]},{"ResourceType":"collection","Resource":["collection/${CollectionName}"],"Permission":["aoss:CreateCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]}],"Principal":["${PipelineRoleArn}"]},{"Description":"Detection task - read-only","Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:ReadDocument","aoss:DescribeIndex"]}],"Principal":["${TaskRoleArn}"]}]'
          - PipelineRoleArn: !GetAtt PipelineRole.Arn
            TaskRoleArn: !GetAtt TaskRole.Arn

  CollectionGroup:
    Type: AWS::OpenSearchServerless::CollectionGroup
    Condition: IsNextGen
    Properties:
      Name: !Sub "${CollectionName}-group"
      Generation: NEXTGEN
      StandbyReplicas: !Ref StandbyReplicas
      Description: NextGen collection group for CloudTrail log analytics
      CapacityLimits:
        MinIndexingCapacityInOcu: 0
        MaxIndexingCapacityInOcu: 4
        MinSearchCapacityInOcu: 0
        MaxSearchCapacityInOcu: 4

  Collection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn: [EncryptionPolicy, NetworkPolicy]
    Properties:
      Name: !Ref CollectionName
      Type: TIMESERIES
      CollectionGroupName: !If [IsNextGen, !Ref CollectionGroup, !Ref AWS::NoValue]
      StandbyReplicas: !If [IsNextGen, !Ref AWS::NoValue, !Ref StandbyReplicas]
      Description: CloudTrail management events

  RetentionPolicy:
    Type: AWS::OpenSearchServerless::LifecyclePolicy
    DependsOn: Collection
    Properties:
      Name: !Sub "${CollectionName}-retention"
      Type: retention
      Policy: !Sub '{"Rules":[{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"MinIndexRetention":"${RetentionDays}d"}]}'

  # ---------------------------------------------------------------------------
  # Ingestion: SQS queue + OpenSearch Ingestion pipeline
  # ---------------------------------------------------------------------------
  # Customer managed key for the queues. The AWS managed key (alias/aws/sqs) can't be used: its key
  # policy can't grant S3 the kms:GenerateDataKey it needs to send event notifications.
  QueueKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for the CloudTrail ingest queue and its dead-letter queue
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccess
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"
          - Sid: S3EventNotifications
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: "*"
            Condition:
              ArnEquals: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:s3:::${CloudTrailBucketName}" }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  IngestDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudtrail-log-queue-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !Ref QueueKmsKey

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudtrail-log-queue
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      KmsMasterKeyId: !Ref QueueKmsKey
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDeadLetterQueue.Arn
        maxReceiveCount: 5

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3Notifications
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:s3:::${CloudTrailBucketName}" }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: osi-cloudtrail-pipeline-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:GetObject]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${CloudTrailBucketName}/*"
          - Effect: Allow
            Action: [s3:ListBucket, s3:GetBucketLocation]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${CloudTrailBucketName}"
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility]
            Resource: !GetAtt IngestQueue.Arn
          # The queue is encrypted with QueueKmsKey; receiving messages requires kms:Decrypt.
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !GetAtt QueueKmsKey.Arn
          # aoss:APIAccessAll is the only IAM action for the OpenSearch Serverless data plane.
          # Per-operation permissions (write documents, manage the index) are granted in
          # DataAccessPolicy, which is where the service enforces them. BatchGetCollection lets the
          # sink look up the collection endpoint; it is called by collection ID, so it is scoped
          # by the collection ARN rather than the aoss:collection (name) condition.
          - Effect: Allow
            Action: [aoss:BatchGetCollection, aoss:APIAccessAll]
            Resource: !GetAtt Collection.Arn
          # OpenSearch Ingestion reads PipelineNetworkPolicy and adds its VPC endpoint to it. The
          # stack creates that policy, so the pipeline doesn't need aoss:CreateSecurityPolicy.
          # These actions don't support resource ARNs, so Resource must be "*"; the
          # aoss:collection condition limits them to policies that cover this collection.
          - Effect: Allow
            Action: [aoss:GetSecurityPolicy, aoss:UpdateSecurityPolicy]
            Resource: "*"
            Condition:
              StringEquals: { "aoss:collection": !Ref CollectionName }
            # If your CloudTrail bucket uses SSE-KMS, also grant kms:Decrypt on that key.
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "${PipelineDlqBucket.Arn}/opensearch-sink-dlq/*"

  # Private bucket for documents the collection rejects. Retained on stack deletion so failed
  # CloudTrail records are never deleted with the stack.
  PipelineDlqBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: pipeline-dlq/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }

  PipelineDlqBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PipelineDlqBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt PipelineDlqBucket.Arn, !Sub "${PipelineDlqBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # Server access logs for PipelineDlqBucket. Retained on stack deletion with the bucket it audits.
  # Server access logging requires SSE-S3 on the destination bucket.
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: This is the access log destination; logging it to itself would loop.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal: { Service: logging.s3.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${AccessLogsBucket.Arn}/pipeline-dlq/*"
            Condition:
              ArnLike: { "aws:SourceArn": !GetAtt PipelineDlqBucket.Arn }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt AccessLogsBucket.Arn, !Sub "${AccessLogsBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: osi-cloudtrail-pipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: osis-pipelines.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      ManagedPolicyArns:
        - !Ref PipelinePolicy

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/OpenSearchIngestion/cloudtrail-pipeline
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogsKmsKey.Arn

  IngestionPipeline:
    Type: AWS::OSIS::Pipeline
    DependsOn: [DataAccessPolicy, IngestQueuePolicy, PipelineNetworkPolicy]
    Properties:
      PipelineName: cloudtrail-pipeline
      MinUnits: 1
      MaxUnits: 4
      LogPublishingOptions:
        IsLoggingEnabled: true
        CloudWatchLogDestination:
          LogGroup: !Ref PipelineLogGroup
      PipelineConfigurationBody: !Sub |
        version: "2"
        cloudtrail-log-pipeline:
          source:
            s3:
              acknowledgments: true
              notification_type: "sqs"
              compression: gzip
              codec:
                json:
              sqs:
                queue_url: "${IngestQueue}"
                maximum_messages: 10
                visibility_timeout: "60s"
                visibility_duplication_protection: true
              aws:
                region: "${AWS::Region}"
                sts_role_arn: "${PipelineRole.Arn}"
          processor:
            - date:
                destination: "@timestamp"
                from_time_received: true
            - delete_entries:
                with_keys: [ "s3" ]
            # These CloudTrail fields have a different shape for every API call. Indexed as
            # objects, they exceed the index's total-field limit and cause mapping conflicts, which
            # reject documents. Store them as JSON strings instead.
            - write_json:
                source: "requestParameters"
            - write_json:
                source: "responseElements"
            - write_json:
                source: "additionalEventData"
            - write_json:
                source: "serviceEventDetails"
          sink:
            - opensearch:
                hosts: [ "${Collection.CollectionEndpoint}" ]
                index: "${IndexName}"
                # Explicit date fields and no date detection: otherwise the first date-like value
                # of a string field (for example apiVersion "2016-11-15") maps it as a date and
                # later values such as "2020_05_31" are rejected.
                template_type: "index-template"
                template_content: >-
                  {"template":{"mappings":{"date_detection":false,"properties":{
                  "@timestamp":{"type":"date"},"eventTime":{"type":"date"}}}}}
                aws:
                  sts_role_arn: "${PipelineRole.Arn}"
                  region: "${AWS::Region}"
                  serverless: true
                  serverless_options:
                    network_policy_name: "${CollectionName}-osi-net"
                # Documents OpenSearch rejects go here. The S3 object is then acknowledged, so SQS
                # doesn't redeliver it and re-index its other records as duplicates.
                dlq:
                  s3:
                    bucket: "${PipelineDlqBucket}"
                    key_path_prefix: "opensearch-sink-dlq/"
                    region: "${AWS::Region}"
                    sts_role_arn: "${PipelineRole.Arn}"

  # ---------------------------------------------------------------------------
  # Alerting: SNS
  # ---------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloudtrail-create-alerts
      KmsMasterKeyId: alias/aws/sns

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------------------
  # Detection: ECR, ECS on Fargate (ARM64), EventBridge schedule
  # ---------------------------------------------------------------------------
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cloudtrail-alert
      ImageScanningConfiguration: { ScanOnPush: true }
      # Tags can't be overwritten, so the task definition (ImageTag) always runs the image that was
      # pushed under that tag. Push each new build under a new tag.
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: KMS

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cloudtrail-alert
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/cloudtrail-alert
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogsKmsKey.Arn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtrail-alert-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: cloudtrail-alert-ecs-task-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # aoss:APIAccessAll is the only IAM action for the OpenSearch Serverless data plane, and
          # it is scoped to this collection. Read-only access (ReadDocument, DescribeIndex) is
          # enforced by DataAccessPolicy, which is where the service evaluates per-operation
          # permissions.
          - Effect: Allow
            Action: aoss:APIAccessAll
            Resource: !GetAtt Collection.Arn
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref AlertTopic

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtrail-alert-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TaskPolicy

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only access for the CloudTrail detection task
      VpcId: !Ref Vpc
      # No ingress. HTTPS egress reaches the VPC endpoints (private IPs), the S3 gateway endpoint
      # (S3 public IP ranges), and the NAT gateway for anything without an endpoint.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints, S3 gateway endpoint, and NAT gateway

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudtrail-alert
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: cloudtrail-alert
          Image: !If
            - UseStackRepo
            - !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${Repository}:${ImageTag}"
            - !Ref ContainerImageUri
          Essential: true
          Environment:
            - { Name: COLLECTION_ENDPOINT, Value: !GetAtt Collection.CollectionEndpoint }
            - { Name: INDEX, Value: !Ref IndexName }
            - { Name: SNS_TOPIC_ARN, Value: !Ref AlertTopic }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref TaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: cloudtrail-alert-events-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ecs:RunTask
            Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/cloudtrail-alert:*"
            Condition:
              ArnEquals: { "ecs:cluster": !GetAtt Cluster.Arn }
          - Effect: Allow
            Action: iam:PassRole
            Resource: [!GetAtt TaskRole.Arn, !GetAtt TaskExecutionRole.Arn]
            Condition:
              StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudtrail-alert-events-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventsPolicy

  DetectionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudtrail-create-alert-hourly
      Description: Runs the CloudTrail detection task on a schedule
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref ScheduleState
      Targets:
        - Id: cloudtrail-alert-task
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
                SecurityGroups: [!Ref TaskSecurityGroup]
                AssignPublicIp: DISABLED

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Description: Subnets the detection task runs in
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  CollectionEndpoint:
    Value: !GetAtt Collection.CollectionEndpoint
  DashboardsEndpoint:
    Value: !GetAtt Collection.DashboardEndpoint
  DeadLetterQueueUrl:
    Description: Messages land here after 5 failed processing attempts; alarm on its depth
    Value: !Ref IngestDeadLetterQueue
  PipelineDlqBucketName:
    Description: Documents rejected by the collection are written under opensearch-sink-dlq/
    Value: !Ref PipelineDlqBucket
  Generation:
    Value: !Ref Generation
  IngestQueueArn:
    Description: Target for the S3 event notification on your CloudTrail bucket
    Value: !GetAtt IngestQueue.Arn
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  AlertTopicArn:
    Value: !Ref AlertTopic
  NextStepS3Notification:
    Description: Run after deployment to send new CloudTrail objects to the queue
    Value: !Sub
      - >-
        aws s3api put-bucket-notification-configuration --bucket ${CloudTrailBucketName}
        --notification-configuration '{"QueueConfigurations":[{"QueueArn":"${IngestQueue.Arn}","Events":["s3:ObjectCreated:*"],"Filter":{"Key":{"FilterRules":[{"Name":"prefix","Value":"${Prefix}"},{"Name":"suffix","Value":".json.gz"}]}}}]}'
      - Prefix: !If [DefaultPrefix, !Sub "AWSLogs/${AWS::AccountId}/CloudTrail/", !Ref CloudTrailPrefix]
